<div class="app-container cashi-marco" *ngIf="!isLoginPage() && authService.isAuthenticated()" [attr.inert]="mantenimiento.bloqueado() ? '' : null"
     [class.mantenimiento-completa]="mantenimiento.encierraAdmin()" [class.menu-plegado]="isSidebarCollapsed">
  <!-- Botón de menú en pantallas angostas -->
  <button type="button" class="mobile-menu-btn" (click)="toggleMobileSidebar()" title="Menú">
    <lucide-angular name="menu" [size]="22"></lucide-angular>
  </button>
  <div class="mobile-backdrop" [class.visible]="isMobileSidebarOpen" (click)="closeMobileSidebar()"></div>

  <app-sidebar [menu]="menuItems"
               [cuenta]="cuentaSidebar"
               [esAdmin]="esAdmin"
               [conBuscador]="isAdminOrSupervisor()"
               [(plegado)]="isSidebarCollapsed"
               [movilAbierto]="isMobileSidebarOpen"
               [notificaciones]="notificacionesCount"
               [notificacionesAbiertas]="isNotificacionesDropdownOpen"
               [notificacionesLista]="notificaciones"
               [temaOscuro]="isDarkMode()"
               [estado]="estadoDelMenu"
               [conVoz]="estadoAsesor.esAsesor()"
               [vozActiva]="estadoAsesor.voz()"
               (navegar)="closeMobileSidebar()"
               (notificacionesAbrir)="toggleNotificacionesDropdown()"
               (notificacionesCerrar)="isNotificacionesDropdownOpen = false"
               (notificacionLeer)="marcarNotificacionLeida($event)"
               (notificacionesLeerTodas)="marcarTodasLeidas()"
               (temaCambiar)="toggleTheme()"
               (vozCambiar)="estadoAsesor.alternarVoz()"
               (salir)="logout()"></app-sidebar>

  <!-- Main Content -->
  <main class="main-content" appCajaTarjetas>
    <app-peripheral-status-banner></app-peripheral-status-banner>
    <router-outlet></router-outlet>
  </main>

  <!-- Notificaciones globales de autorización (para supervisores) -->
  <app-authorization-notification></app-authorization-notification>

  <!-- Panel flotante de supervisión de llamadas -->
  <app-supervision-panel></app-supervision-panel>

</div>

<app-whatsapp-notification-popup *ngIf="!isLoginPage() && authService.isAuthenticated()"></app-whatsapp-notification-popup>
<!-- Pila de avisos, arriba a la derecha: el de mantenimiento primero y debajo los de la jornada del asesor -->
<div class="pila-avisos" *ngIf="!isLoginPage()" #pilaAvisos>
  <app-mantenimiento-aviso *ngIf="authService.isAuthenticated()"></app-mantenimiento-aviso>
  <app-avisos-asistencia></app-avisos-asistencia>
</div>

<!-- Pantalla de mantenimiento: tapa la aplicación sin recargarla -->
<app-mantenimiento-pantalla *ngIf="!isLoginPage() && authService.isAuthenticated()"></app-mantenimiento-pantalla>

<div *ngIf="isLoginPage() || !authService.isAuthenticated()">
  <router-outlet></router-outlet>
</div>

<app-toast-notification></app-toast-notification>
