<div class="app-container cashi-marco" *ngIf="!isLoginPage() && authService.isAuthenticated()" [attr.inert]="mantenimiento.bloqueado() ? '' : null"
     [class.mantenimiento-completa]="mantenimiento.encierraAdmin()" [class.menu-plegado]="isSidebarCollapsed">
  <!-- Botón de menú en pantallas angostas -->
  <button type="button" class="mobile-menu-btn" (click)="toggleMobileSidebar()" title="Menú">
    <lucide-angular name="menu" [size]="22"></lucide-angular>
  </button>
  <div class="mobile-backdrop" [class.visible]="isMobileSidebarOpen" (click)="closeMobileSidebar()"></div>

  <app-sidebar [menu]="menuItems"
               [cuenta]="cuentaSidebar"
               [esAdmin]="esAdmin"
               [conBuscador]="isAdminOrSupervisor()"
               [(plegado)]="isSidebarCollapsed"
               [movilAbierto]="isMobileSidebarOpen"
               [notificaciones]="notificacionesCount"
               [temaOscuro]="isDarkMode()"
               (navegar)="closeMobileSidebar()"
               (notificacionesAbrir)="toggleNotificacionesDropdown()"
               (temaCambiar)="toggleTheme()"
               (salir)="logout()"></app-sidebar>

  <!-- Main Content -->
  <main class="main-content" appCajaTarjetas>
    <app-peripheral-status-banner></app-peripheral-status-banner>
    <router-outlet></router-outlet>
  </main>

  <!-- Notificaciones globales de autorización (para supervisores) -->
  <app-authorization-notification></app-authorization-notification>

  <!-- Overlay de alerta de tiempo para agentes (oculto en tipificación) -->
  <app-agent-time-alert-overlay *ngIf="!isCollectionManagementPage()"></app-agent-time-alert-overlay>

  <!-- Panel flotante de supervisión de llamadas -->
  <app-supervision-panel></app-supervision-panel>

  <!-- Panel flotante de notificaciones del sistema -->
  <div *ngIf="isNotificacionesDropdownOpen && (authService.currentUser$ | async)?.role === 'ADMIN'"
       class="notif-panel fixed z-[9999]"
       [style.bottom.px]="16"
       [style.left.px]="isSidebarCollapsed ? 96 : 300">

    <!-- Backdrop para cerrar -->
    <div class="fixed inset-0 z-[-1]" (click)="isNotificacionesDropdownOpen = false"></div>

    <!-- Header -->
    <div class="notif-header">
      <div class="notif-header-left">
        <div class="notif-icon-wrapper">
          <lucide-angular name="bell" [size]="18"></lucide-angular>
        </div>
        <span class="notif-title">Notificaciones</span>
        <span *ngIf="notificacionesCount > 0" class="notif-badge">{{ notificacionesCount }}</span>
      </div>
      <div class="notif-header-right">
        <button *ngIf="notificacionesCount > 0"
                (click)="marcarTodasLeidas()"
                class="notif-mark-read-btn">
          <lucide-angular name="check-check" [size]="14"></lucide-angular>
          <span>Marcar leídas</span>
        </button>
        <button (click)="isNotificacionesDropdownOpen = false"
                class="notif-close-btn">
          <lucide-angular name="x" [size]="18"></lucide-angular>
        </button>
      </div>
    </div>

    <!-- Lista de notificaciones -->
    <div class="notif-list">
      <!-- Empty state -->
      <div *ngIf="notificaciones.length === 0" class="notif-empty">
        <div class="notif-empty-icon">
          <lucide-angular name="bell-off" [size]="40"></lucide-angular>
        </div>
        <p class="notif-empty-title">Sin notificaciones</p>
        <p class="notif-empty-subtitle">Las notificaciones nuevas aparecerán aquí</p>
      </div>

      <!-- Notification items -->
      <div *ngFor="let notif of notificaciones"
           (click)="marcarNotificacionLeida(notif)"
           class="notif-item"
           [class.unread]="!notif.leida">

        <div class="notif-item-icon" [class]="getNotificacionColor(notif.tipo)">
          <lucide-angular [name]="getNotificacionIcon(notif.tipo)" [size]="16"></lucide-angular>
        </div>

        <div class="notif-item-content">
          <div class="notif-item-header">
            <span class="notif-item-title">{{ notif.titulo }}</span>
            <span *ngIf="!notif.leida" class="notif-unread-dot"></span>
          </div>
          <p class="notif-item-message">{{ notif.mensaje }}</p>
          <span class="notif-item-time">
            <lucide-angular name="clock" [size]="12"></lucide-angular>
            {{ notif.fechaCreacion | appDateTime }}
          </span>
        </div>
      </div>
    </div>
  </div>
</div>

<app-whatsapp-notification-popup *ngIf="!isLoginPage() && authService.isAuthenticated()"></app-whatsapp-notification-popup>
<!-- Pila de avisos, arriba a la derecha: el de mantenimiento primero y debajo los de la jornada del asesor -->
<div class="pila-avisos" *ngIf="!isLoginPage()">
  <app-mantenimiento-aviso *ngIf="authService.isAuthenticated()"></app-mantenimiento-aviso>
  <app-avisos-asistencia></app-avisos-asistencia>
</div>

<!-- Pantalla de mantenimiento: tapa la aplicación sin recargarla -->
<app-mantenimiento-pantalla *ngIf="!isLoginPage() && authService.isAuthenticated()"></app-mantenimiento-pantalla>

<div *ngIf="isLoginPage() || !authService.isAuthenticated()">
  <router-outlet></router-outlet>
</div>

<app-toast-notification></app-toast-notification>
