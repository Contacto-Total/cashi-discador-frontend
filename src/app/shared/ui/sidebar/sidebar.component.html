<aside class="font-cashi group/sb fixed inset-y-0 left-0 z-[1000] flex flex-col border-r border-sidebar-border! bg-sidebar! text-[14px] leading-[1.5] text-sidebar-foreground antialiased transition-[width,translate] duration-[280ms] ease-[cubic-bezier(.4,0,.2,1)] max-md:w-[17.5rem]"
       [ngClass]="[plegado ? 'w-[4.75rem]' : 'w-[17.5rem]', movilAbierto ? 'max-md:translate-x-0' : 'max-md:-translate-x-full']"
       [attr.data-plegado]="plegado ? '' : null"
       aria-label="Menú principal">

  <!-- Marca: mide lo mismo que la cabecera de pantalla y lleva su mismo borde, para que la raya empalme. -->
  <div class="flex h-20 flex-none items-center justify-center gap-3 overflow-clip border-b border-sidebar-border px-3.5 transition-[gap] duration-[280ms] ease-[cubic-bezier(.4,0,.2,1)] group-data-[plegado]/sb:gap-0">
    <app-cashi-mascota [escala]="0.44" [plana]="true"></app-cashi-mascota>
    <span class="max-w-24 overflow-hidden text-[16px] leading-none font-bold tracking-[.08em] whitespace-nowrap transition-[max-width,opacity] duration-[280ms] ease-[cubic-bezier(.4,0,.2,1)] group-data-[plegado]/sb:max-w-0 group-data-[plegado]/sb:opacity-0">CASHI</span>
  </div>

  <!-- Buscador. Campo y lupa ocupan el mismo sitio y se relevan con un fundido: nada se mueve. -->
  <div *ngIf="conBuscador" class="relative px-3.5 pt-3.5 pb-[.75rem]">
    <div class="relative transition-opacity delay-[120ms] duration-[140ms] group-data-[plegado]/sb:opacity-0 group-data-[plegado]/sb:delay-0" [attr.inert]="plegado ? '' : null">
      <lucide-angular [ngClass]="'pointer-events-none absolute top-1/2 left-2.5 -translate-y-1/2 text-muted-foreground'" name="search" [size]="14"></lucide-angular>
      <input #campoBuscar type="search" [(ngModel)]="filtro" placeholder="Buscar pantalla…" aria-label="Buscar pantalla"
             class="font-cashi h-9 w-full rounded-lg border! border-border! bg-background/60! pr-3 pl-[2.125rem] text-[14px] text-foreground! outline-none placeholder:text-muted-foreground focus:border-ring! focus:shadow-[0_0_0_3px_rgb(16_185_129/.3)]">
    </div>
    <button type="button" [class]="FILA + ' ' + FILA_REPOSO"
            class="absolute! top-3.5 left-3.5 h-9 w-[calc(4.75rem-1.75rem-1px)]! py-0! pointer-events-none opacity-0 transition-[opacity,background-color,color] duration-[140ms] group-data-[plegado]/sb:pointer-events-auto group-data-[plegado]/sb:opacity-100 group-data-[plegado]/sb:delay-[120ms]"
            aria-label="Buscar pantalla" appTip="Buscar pantalla" [appTipActivo]="plegado" [attr.tabindex]="plegado ? 0 : -1" (click)="abrirBuscador()">
      <lucide-angular name="search" [size]="19.2" [ngClass]="'flex-none ' + (ICONO_REPOSO)"></lucide-angular>
    </button>
  </div>

  <!-- Menú -->
  <nav class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto px-3.5 pb-[.75rem]" [class.pt-3.5]="!conBuscador">
    <!-- Resultado de la búsqueda -->
    <ng-container *ngIf="resultados as hallados; else menuCompleto">
      <ul *ngIf="hallados.length; else sinResultados" class="m-0 flex list-none flex-col gap-1 p-0">
        <li *ngFor="let item of hallados">
          <ng-container *ngTemplateOutlet="enlace; context: { $implicit: item, hija: false }"></ng-container>
        </li>
      </ul>
      <ng-template #sinResultados>
        <p class="m-0 px-2.5 py-2 text-[12px] text-muted-foreground">Sin resultados para «{{ filtro }}»</p>
      </ng-template>
    </ng-container>

    <ng-template #menuCompleto>
      <ul class="m-0 flex list-none flex-col gap-1 p-0">
        <li *ngFor="let item of menu">
          <ng-container *ngIf="!esGrupo(item)">
            <ng-container *ngTemplateOutlet="enlace; context: { $implicit: item, hija: false }"></ng-container>
          </ng-container>

          <ng-container *ngIf="esGrupo(item)">
            <button type="button" [class]="FILA" [ngClass]="dentro(item) ? 'bg-transparent text-sidebar-foreground! hover:bg-sidebar-accent/60' : FILA_REPOSO"
                    [attr.aria-expanded]="abierto(item) && !plegado" [appTip]="item.etiqueta + ' · ' + item.children.length + ' pantallas'" [appTipActivo]="plegado"
                    (click)="alternarGrupo(item)">
              <lucide-angular [name]="icono(item)" [size]="19.2" [ngClass]="'flex-none ' + (ICONO_REPOSO)"></lucide-angular>
              <span [class]="TEXTO">{{ item.etiqueta }}</span>
              <lucide-angular [ngClass]="'flex-none text-[color-mix(in_srgb,currentColor_50%,transparent)] transition-[rotate,opacity] duration-200 group-data-[plegado]/sb:opacity-0'" name="chevron-right" [size]="14" [class.rotate-90]="abierto(item)"></lucide-angular>
            </button>
            <div class="grid transition-[grid-template-rows] duration-200 ease-out" [ngClass]="abierto(item) && !plegado ? 'grid-rows-[1fr]' : 'grid-rows-[0fr]'">
              <ul class="m-0 ml-6 flex min-h-0 list-none flex-col gap-1 overflow-hidden border-l border-sidebar-border/70 p-0 pl-2" [class.my-1]="abierto(item) && !plegado">
                <li *ngFor="let hija of item.children">
                  <ng-container *ngTemplateOutlet="enlace; context: { $implicit: hija, hija: true }"></ng-container>
                </li>
              </ul>
            </div>
          </ng-container>
        </li>
      </ul>
      <div *ngIf="menu.length === 0" [class]="FILA + ' ' + FILA_REPOSO" class="cursor-default! opacity-50">
        <lucide-angular [ngClass]="'flex-none animate-spin'" name="loader-2" [size]="19.2"></lucide-angular>
        <span [class]="TEXTO">Cargando menú…</span>
      </div>
    </ng-template>
  </nav>

  <!-- Plegar o desplegar: la manija flota sobre el canto, a media altura. -->
  <button type="button" (click)="alternarPlegado()" [attr.aria-label]="plegado ? 'Expandir menú' : 'Contraer menú'"
          class="absolute top-1/2 -right-3.5 z-[8] grid size-7 -translate-y-1/2 cursor-pointer place-items-center rounded-full border-0 bg-primary text-white shadow-[0_4px_6px_-1px_rgb(0_0_0/.1),0_0_0_4px_var(--sidebar)] transition-colors duration-150 hover:bg-[#036c4e] focus-visible:outline-2 focus-visible:outline-offset-[3px] focus-visible:outline-ring max-md:hidden">
    <lucide-angular [ngClass]="'transition-[rotate] duration-200'" name="chevron-left" [size]="16" [strokeWidth]="2.5" [class.rotate-180]="plegado"></lucide-angular>
  </button>

  <!-- Pie: la cuenta y, al costado, el tema, las notificaciones y la salida. Mantenimiento y Configuración
       se despliegan sobre la cuenta al pulsarla, igual abierto que plegado (plegado, solo sus iconos). -->
  <div class="group/pie overflow-clip border-t border-sidebar-border py-3.5 pr-2 pl-3.5" data-cuenta [attr.data-abierta]="cuentaAbierta ? '' : null">
    <div *ngIf="esAdmin" class="grid grid-rows-[0fr] transition-[grid-template-rows] duration-200 ease-out group-data-[abierta]/pie:grid-rows-[1fr]">
      <div class="invisible min-h-0 overflow-hidden transition-[visibility] delay-200 duration-0 group-data-[abierta]/pie:visible group-data-[abierta]/pie:delay-0">
        <ul id="sb-opciones" class="m-0 mb-[.5rem] flex w-[15.6875rem] list-none flex-col gap-1 p-0 group-data-[plegado]/sb:w-12">
          <li>
            <a routerLink="/admin/mantenimiento-sistema" [class]="FILA" [ngClass]="activa('/admin/mantenimiento-sistema') ? FILA_ACTIVA : FILA_REPOSO"
               appTip="Modo mantenimiento" [appTipActivo]="plegado" (click)="alNavegar()">
              <lucide-angular name="wrench" [size]="19.2" [strokeWidth]="activa('/admin/mantenimiento-sistema') ? 2.3 : 2" [ngClass]="'flex-none ' + (activa('/admin/mantenimiento-sistema') ? ICONO_ACTIVO : ICONO_REPOSO)"></lucide-angular>
              <span [class]="TEXTO">Modo mantenimiento</span>
            </a>
          </li>
          <li>
            <a routerLink="/settings" [class]="FILA" [ngClass]="activa('/settings') ? FILA_ACTIVA : FILA_REPOSO"
               appTip="Configuración" [appTipActivo]="plegado" (click)="alNavegar()">
              <lucide-angular name="settings-2" [size]="19.2" [strokeWidth]="activa('/settings') ? 2.3 : 2" [ngClass]="'flex-none ' + (activa('/settings') ? ICONO_ACTIVO : ICONO_REPOSO)"></lucide-angular>
              <span [class]="TEXTO">Configuración</span>
            </a>
          </li>
        </ul>
      </div>
    </div>

    <!-- La fila mide siempre lo mismo: al plegar no se recoloca nada, el ancho la recorta. -->
    <div class="flex w-[16.0625rem] items-center gap-1.5">
      <button type="button" class="group/yo relative flex min-h-10 min-w-0 flex-1 items-center gap-2 rounded-lg border-0 bg-transparent py-1 pr-2 pl-3.5 text-left text-sidebar-foreground transition-colors duration-150"
              [ngClass]="esAdmin ? 'cursor-pointer hover:bg-sidebar-accent/60 group-data-[plegado]/sb:hover:bg-transparent' : 'cursor-default'"
              [attr.aria-expanded]="esAdmin ? cuentaAbierta : null" [attr.aria-controls]="esAdmin ? 'sb-opciones' : null"
              [appTip]="cuenta ? cuenta.usuario + ' · ' + cuenta.rol : ''" [appTipActivo]="plegado" (click)="alternarCuenta()">
        <!-- El avatar solo se ve con el menú plegado: ocupa el sitio del nombre y se relevan con un fundido. -->
        <span class="absolute top-1/2 left-2 flex size-8 -translate-y-1/2 items-center justify-center rounded-full bg-brand/12 text-[12px] font-bold text-brand opacity-0 transition-[opacity,box-shadow] duration-[140ms] group-data-[plegado]/sb:opacity-100 group-data-[plegado]/sb:delay-[120ms]"
              [ngClass]="esAdmin ? 'group-data-[plegado]/sb:group-hover/yo:shadow-[0_0_0_2px_color-mix(in_srgb,var(--brand)_35%,transparent)] group-data-[plegado]/sb:group-data-[abierta]/pie:shadow-[0_0_0_2px_color-mix(in_srgb,var(--brand)_35%,transparent)]' : ''">{{ cuenta?.iniciales }}</span>
        <span class="min-w-0 flex-[0_1_auto] overflow-hidden whitespace-nowrap transition-opacity duration-[180ms] group-data-[plegado]/sb:opacity-0">
          <span class="block overflow-hidden text-[14px] leading-[1.35] font-semibold text-ellipsis whitespace-nowrap">{{ cuenta?.usuario }}</span>
          <span class="block overflow-hidden text-[12px] leading-[1.35] text-ellipsis whitespace-nowrap text-muted-foreground tabular-nums">{{ cuenta?.rol }}<ng-container *ngIf="cuenta?.anexo"> · {{ cuenta?.anexo }}</ng-container></span>
        </span>
        <lucide-angular [ngClass]="'flex-none text-muted-foreground transition-[opacity,rotate] duration-200 group-data-[abierta]/pie:rotate-180 group-data-[plegado]/sb:opacity-0'" *ngIf="esAdmin" name="chevron-up" [size]="14"></lucide-angular>
      </button>

      <div class="flex flex-none items-center gap-0.5 transition-opacity duration-[180ms] group-data-[plegado]/sb:opacity-0" [attr.inert]="plegado ? '' : null">
        <button *ngIf="esAdmin" type="button" [class]="BOTON_ICONO + ' ' + BOTON_ICONO_NEUTRO" [attr.aria-label]="temaOscuro ? 'Modo claro' : 'Modo oscuro'"
                [appTip]="temaOscuro ? 'Modo claro' : 'Modo oscuro'" appTipLado="arriba" (click)="temaCambiar.emit()">
          <lucide-angular [name]="temaOscuro ? 'sun' : 'moon'" [size]="16"></lucide-angular>
        </button>
        <button *ngIf="esAdmin" type="button" [class]="BOTON_ICONO + ' ' + BOTON_ICONO_NEUTRO" aria-label="Notificaciones"
                appTip="Notificaciones" appTipLado="arriba" (click)="$event.stopPropagation(); notificacionesAbrir.emit()">
          <lucide-angular name="bell" [size]="16"></lucide-angular>
          <span *ngIf="notificaciones > 0" class="absolute top-px right-px h-3.5 min-w-3.5 rounded-full bg-[#a63e30] px-[.2rem] text-center text-[10px] leading-[.875rem] font-bold text-white">{{ notificaciones > 9 ? '9+' : notificaciones }}</span>
        </button>
        <a *ngIf="!esAdmin" routerLink="/settings" [class]="BOTON_ICONO + ' ' + BOTON_ICONO_NEUTRO" class="nav-item" [ngClass]="activa('/settings') ? 'bg-sidebar-accent! text-brand!' : ''"
           aria-label="Configuración" appTip="Configuración" appTipLado="arriba" (click)="alNavegar()">
          <lucide-angular name="settings-2" [size]="16"></lucide-angular>
        </a>
        <button type="button" [class]="BOTON_ICONO + ' ' + BOTON_ICONO_SALIR" aria-label="Cerrar sesión" appTip="Cerrar sesión" appTipLado="arriba" (click)="salir.emit()">
          <lucide-angular name="power" [size]="16"></lucide-angular>
        </button>
      </div>
    </div>

    <!-- Plegado, la salida baja a una columna bajo el avatar, que se abre al mismo ritmo que el ancho. -->
    <div class="grid grid-rows-[0fr] transition-[grid-template-rows] duration-[280ms] ease-[cubic-bezier(.4,0,.2,1)] group-data-[plegado]/sb:grid-rows-[1fr]">
      <div class="invisible min-h-0 overflow-hidden transition-[visibility] delay-[280ms] duration-0 group-data-[plegado]/sb:visible group-data-[plegado]/sb:delay-0">
        <div class="flex flex-col gap-1 pt-[.5rem] pl-[.625rem]">
          <button type="button" [class]="BOTON_ICONO + ' ' + BOTON_ICONO_SALIR" aria-label="Cerrar sesión" appTip="Cerrar sesión" (click)="salir.emit()">
            <lucide-angular name="power" [size]="16"></lucide-angular>
          </button>
        </div>
      </div>
    </div>
  </div>
</aside>

<!-- Fila del menú: enlace a una pantalla. -->
<ng-template #enlace let-item let-hija="hija">
  <a [routerLink]="item.ruta" [class]="FILA + (hija ? ' ' + FILA_HIJA : '')" [ngClass]="activa(item.ruta) ? FILA_ACTIVA : FILA_REPOSO"
     [attr.aria-current]="activa(item.ruta) ? 'page' : null" [appTip]="item.etiqueta" [appTipActivo]="plegado" (click)="alNavegar()">
    <lucide-angular [name]="icono(item)" [size]="19.2" [strokeWidth]="activa(item.ruta) ? 2.3 : 2" [ngClass]="'flex-none ' + (activa(item.ruta) ? ICONO_ACTIVO : ICONO_REPOSO)"></lucide-angular>
    <span [class]="TEXTO">{{ item.etiqueta }}</span>
  </a>
</ng-template>
